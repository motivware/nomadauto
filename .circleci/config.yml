version: 2.1

jobs:
  test:
    docker:
      - image: cimg/ruby:3.3.10-node
        environment:
          RAILS_ENV: test
          CI: "true"
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/project_test
          REDIS_URL: redis://127.0.0.1:6379/0
      - image: cimg/postgres:15.4
        environment:
          POSTGRES_USER: postgres
          POSTGRES_DB: project_test
      - image: cimg/redis:7.2
    steps:
      - checkout

      - run:
          name: Enable Corepack (Yarn)
          command: |
            sudo corepack enable
            yarn --version

      - run:
          name: Wait for PostgreSQL
          command: |
            for i in $(seq 1 30); do
              pg_isready -h 127.0.0.1 -p 5432 -U postgres && exit 0
              echo "Waiting for postgres..."
              sleep 2
            done
            echo "Postgres did not become ready in time" >&2
            exit 1

      - restore_cache:
          keys:
            - gem-cache-v2-{{ arch }}-{{ checksum "Gemfile.lock" }}
            - gem-cache-v2-{{ arch }}-

      - run:
          name: Install Ruby dependencies
          command: |
            bundle config set path 'vendor/bundle'
            bundle install --jobs=4 --retry=3

      - save_cache:
          key: gem-cache-v2-{{ arch }}-{{ checksum "Gemfile.lock" }}
          paths:
            - vendor/bundle

      - restore_cache:
          keys:
            - yarn-cache-v2-{{ arch }}-{{ checksum "yarn.lock" }}
            - yarn-cache-v2-{{ arch }}-

      - run:
          name: Install JavaScript dependencies
          command: yarn install --immutable

      - save_cache:
          key: yarn-cache-v2-{{ arch }}-{{ checksum "yarn.lock" }}
          paths:
            - ~/.cache/yarn
            - .yarn/cache
            - node_modules

      - run:
          name: Install Playwright browser
          command: npx playwright install chromium

      - run:
          name: Prepare test database
          command: bundle exec rails db:prepare

      - run:
          name: Run RSpec
          command: bundle exec rspec

workflows:
  test:
    jobs:
      - test
